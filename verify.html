<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>安全验证</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .verify-card {
      background: #fff;
      width: 360px;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      margin: 0 auto;
    }

    .verify-title {
      font-size: 16px;
      color: #666;
      margin-bottom: 12px;
    }

    .verify-subtitle {
      font-size: 18px;
      color: #333;
      margin-bottom: 24px;
    }

    .verify-container {
      width: 312px;
      height: 156px;
      margin: 0 auto 24px;
      position: relative;
      border: 1px solid #eee;
      background: #f5f5f5;
    }

    .verify-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .verify-gap {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 1px solid #ddd;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      display: none;
    }

    .verify-slider {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 1px solid #ddd;
      background: #fff;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 18px;
      cursor: grab;
      z-index: 10;
      display: none;
    }

    .verify-slider:active {
      cursor: grabbing;
    }

    .img-loading {
      font-size: 12px;
      color: #999;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .slider-container {
      width: 100%;
      height: 44px;
      background: #f5f5f5;
      border-radius: 22px;
      position: relative;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .slider-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #42b983, #35a873);
      border-radius: 22px;
      width: 0;
      transition: width 0.1s linear;
    }

    .slider-btn {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 44px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 18px;
      transition: left 0.1s linear;
      z-index: 10;
    }

    .slider-btn:active {
      cursor: grabbing;
    }

    .slider-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #999;
      font-size: 14px;
      pointer-events: none;
    }

    .verify-footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 12px;
      color: #999;
    }

    .verify-footer a {
      color: #999;
      text-decoration: none;
    }

    .verify-footer a:hover {
      color: #666;
    }

    .success-tip {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="verify-card">
    <div class="verify-title">百度安全验证</div>
    <div class="verify-subtitle">请完成下方验证后继续操作</div>

    <div class="verify-container">
      <div class="img-loading" id="imgLoading">图片加载中...</div>
      <img src="" alt="验证图片" class="verify-bg" id="verifyBg">
      <div class="verify-gap" id="verifyGap"></div>
      <div class="verify-slider" id="verifySlider">|||</div>
    </div>

    <div class="slider-container">
      <div class="slider-progress" id="sliderProgress"></div>
      <div class="slider-btn" id="sliderBtn">
        <span>|||</span>
      </div>
      <div class="slider-text">拖动滑块完成拼图</div>
    </div>

    <div class="verify-footer">
      <a href="#">扫码验证</a>
      <a href="#">意见反馈</a>
    </div>
  </div>

  <div class="success-tip" id="successTip">验证成功！</div>

  <script>
    // 核心配置：10张在线图片（随机加载，永不掉链）
    const imgList = [
      'https://picsum.photos/seed/verify1/312/156',
      'https://picsum.photos/seed/verify2/312/156',
      'https://picsum.photos/seed/verify3/312/156',
      'https://picsum.photos/seed/verify4/312/156',
      'https://picsum.photos/seed/verify5/312/156',
      'https://picsum.photos/seed/verify6/312/156',
      'https://picsum.photos/seed/verify7/312/156',
      'https://picsum.photos/seed/verify8/312/156',
      'https://picsum.photos/seed/verify9/312/156',
      'https://picsum.photos/seed/verify10/312/156'
    ];

    // 全局变量
    const verifyBg = document.getElementById('verifyBg');
    const verifyGap = document.getElementById('verifyGap');
    const verifySlider = document.getElementById('verifySlider');
    const sliderBtn = document.getElementById('sliderBtn');
    const sliderProgress = document.getElementById('sliderProgress');
    const sliderContainer = document.querySelector('.slider-container');
    const successTip = document.getElementById('successTip');
    const imgLoading = document.getElementById('imgLoading');
    let isDragging = false;
    let startX = 0;
    let startLeft = 0;
    let targetX = 0;
    const containerWidth = sliderContainer.offsetWidth;
    const btnWidth = sliderBtn.offsetWidth;
    const verifyWidth = 312;
    const gapWidth = 40;

    // 随机加载在线图片（带加载提示+容错，确保必显示）
    function getRandomImg() {
      imgLoading.style.display = 'block';
      verifyBg.style.display = 'none';
      verifyGap.style.display = 'none';
      verifySlider.style.display = 'none';

      // 随机选择一张在线图片
      const randomIndex = Math.floor(Math.random() * imgList.length);
      const randomImgPath = imgList[randomIndex];

      // 预加载图片，确保加载成功再显示
      const tempImg = new Image();
      tempImg.src = randomImgPath;

      // 图片加载成功
      tempImg.onload = function() {
        verifyBg.src = randomImgPath;
        verifyBg.style.display = 'block';
        imgLoading.style.display = 'none';
        
        // 随机生成缺口位置
        targetX = Math.floor(Math.random() * (verifyWidth - gapWidth * 2)) + gapWidth;
        
        // 设置缺口位置
        verifyGap.style.left = `${targetX}px`;
        verifyGap.style.top = `${(156 - gapWidth) / 2}px`;
        verifyGap.style.display = 'block';
        
        // 设置滑块初始位置
        verifySlider.style.left = `${gapWidth}px`;
        verifySlider.style.top = `${(156 - gapWidth) / 2}px`;
        verifySlider.style.display = 'block';
      };

      // 图片加载失败（兜底，确保必显示图片）
      tempImg.onerror = function() {
        imgLoading.textContent = '图片加载中...';
        // 兜底在线图片，永不失效
        verifyBg.src = 'https://picsum.photos/312/156';
        verifyBg.style.display = 'block';
        
        // 随机生成缺口位置
        targetX = Math.floor(Math.random() * (verifyWidth - gapWidth * 2)) + gapWidth;
        
        // 设置缺口位置
        verifyGap.style.left = `${targetX}px`;
        verifyGap.style.top = `${(156 - gapWidth) / 2}px`;
        verifyGap.style.display = 'block';
        
        // 设置滑块初始位置
        verifySlider.style.left = `${gapWidth}px`;
        verifySlider.style.top = `${(156 - gapWidth) / 2}px`;
        verifySlider.style.display = 'block';
      };
    }

    // 页面加载完成后，立即加载随机图片（确保图片显示）
    window.onload = function() {
      getRandomImg();
    };

    // 滑块拖拽逻辑
    sliderBtn.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startLeft = sliderBtn.offsetLeft;
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const deltaX = e.clientX - startX;
      let newLeft = startLeft + deltaX;
      // 限制滑块范围，不超出容器
      newLeft = Math.max(0, Math.min(newLeft, containerWidth - btnWidth));

      // 更新滑块和进度条
      sliderBtn.style.left = `${newLeft}px`;
      sliderProgress.style.width = `${newLeft + btnWidth / 2}px`;

      // 计算滑块在验证区域的位置
      const verifyRatio = newLeft / (containerWidth - btnWidth);
      const sliderX = gapWidth + (verifyWidth - gapWidth * 2) * verifyRatio;
      verifySlider.style.left = `${sliderX}px`;

      // 更新起始位置，确保拖拽流畅
      startX = e.clientX;
      startLeft = newLeft;
    });

    // 验证逻辑
    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;

      // 计算当前滑块位置
      const currentLeft = sliderBtn.offsetLeft;
      const verifyRatio = currentLeft / (containerWidth - btnWidth);
      const currentX = gapWidth + (verifyWidth - gapWidth * 2) * verifyRatio;

      // 验证是否成功（允许±5px的误差）
      const isVerified = Math.abs(currentX - targetX) <= 5;
      if (isVerified) {
        successTip.style.display = 'block';
        setTimeout(() => {
          successTip.style.display = 'none';
          // 跳转页面
          window.location.href = 'page2.html';
        }, 500);
      } else {
        // 验证失败：重置滑块
        sliderBtn.style.left = '0px';
        sliderProgress.style.width = '0px';
        verifySlider.style.left = `${gapWidth}px`;
        alert('验证失败，请重试！');
      }
    });

    // 鼠标离开窗口，重置滑块
    document.addEventListener('mouseleave', () => {
      if (isDragging) {
        isDragging = false;
        sliderBtn.style.left = '0px';
        sliderProgress.style.width = '0px';
        verifySlider.style.left = `${gapWidth}px`;
      }
    });
  </script>
</body>
</html>
